name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    name: Lint, analyse, unit (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['7.4', '8.1', '8.3', '8.4']
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache
          key: composer-${{ runner.os }}-${{ matrix.php }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ runner.os }}-${{ matrix.php }}-

      - run: composer install --no-interaction --no-progress --prefer-dist
      - run: composer lint
      - run: composer analyse
      - run: composer test:unit

  integration:
    name: Integration (wp-env, PHP 8.3)
    runs-on: ubuntu-latest
    needs: static
    defaults:
      run:
        working-directory: wp-checkpoint
    steps:
      # wp-env mounts the plugin under its directory name, so it must be "wp-checkpoint".
      - uses: actions/checkout@v4
        with:
          path: wp-checkpoint

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          tools: composer:v2

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: wp-checkpoint/package-lock.json

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache
          key: composer-${{ runner.os }}-8.3-${{ hashFiles('wp-checkpoint/composer.lock') }}
          restore-keys: composer-${{ runner.os }}-8.3-

      # vendor/ is bind-mounted into the wp-env containers, so installing on the host is enough.
      - run: composer install --no-interaction --no-progress --prefer-dist
      - run: npm ci
      - run: npx wp-env start
      - run: npm run test:integration

      - name: Show wp-env logs on failure
        if: failure()
        run: npx wp-env logs tests --watch=false
