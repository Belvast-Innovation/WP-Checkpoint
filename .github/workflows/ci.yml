name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    name: Lint, analyse, unit (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['7.4', '8.1', '8.3', '8.4']
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache
          key: composer-${{ runner.os }}-${{ matrix.php }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ runner.os }}-${{ matrix.php }}-

      - run: composer install --no-interaction --no-progress --prefer-dist
      - run: composer lint
      - run: composer analyse
      - run: composer test:unit

  unit-windows-part:
    # The Windows run is the slowest in CI; its parts run side by side (phpunit.xml.dist, unit-windows-*).
    name: Unit (Windows, PHP 8.3, part ${{ matrix.part }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        part: [1, 2, 3]
    env:
      WPCHECKPOINT_TEST_SUITE: unit
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          tools: composer:v2

      - run: composer install --no-interaction --no-progress --prefer-dist
      - run: php vendor/bin/phpunit --testsuite unit-windows-${{ matrix.part }} --log-junit build/junit-unit-windows-${{ matrix.part }}.xml

      # Each test's time on Windows: what the split into parts is based on.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: junit-unit-windows-${{ matrix.part }}
          path: build/junit-unit-windows-${{ matrix.part }}.xml
          if-no-files-found: ignore

  unit-windows:
    # The check the main branch requires: passes only when every part passed.
    name: Unit (Windows, PHP 8.3)
    runs-on: ubuntu-latest
    needs: unit-windows-part
    if: always()
    steps:
      - name: Every part passed
        env:
          RESULT: ${{ needs.unit-windows-part.result }}
        run: test "$RESULT" = success

  extractors:
    # Other people's tools must read what the plugin writes (names, content, modes): only real readers can tell.
    name: Extractors (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            tools: unzip-c-utf8 unzip-no-locale 7z bsdtar python
          - os: macos-latest
            tools: ditto unzip-c-utf8 unzip-no-locale bsdtar python
          - os: windows-latest
            tools: expand-archive bsdtar 7z python
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          tools: composer:v2

      - name: Install extractors
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends unzip 7zip libarchive-tools

      - run: composer install --no-interaction --no-progress --prefer-dist
      - run: php tests/extractors/check.php ${{ matrix.tools }}

  integration:
    name: Integration (wp-env, PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    needs: static
    strategy:
      fail-fast: false
      matrix:
        php: ['7.4', '8.3', '8.4']
    defaults:
      run:
        working-directory: wp-checkpoint
    env:
      WP_ENV_PHP_VERSION: ${{ matrix.php }}
    steps:
      # wp-env mounts the plugin under its directory name, so it must be "wp-checkpoint".
      - uses: actions/checkout@v4
        with:
          path: wp-checkpoint

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          tools: composer:v2

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: wp-checkpoint/package-lock.json

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache
          key: composer-${{ runner.os }}-8.3-${{ hashFiles('wp-checkpoint/composer.lock') }}
          restore-keys: composer-${{ runner.os }}-8.3-

      # vendor/ is bind-mounted into the wp-env containers, so installing on the host is enough.
      - run: composer install --no-interaction --no-progress --prefer-dist
      - run: npm ci
      - run: npx wp-env start
      - run: npm run test:integration

      - name: Show wp-env logs on failure
        if: failure()
        run: npx wp-env logs tests --watch=false

  manual-restore:
    # The manual restore steps for users without the plugin, run as written on a real archive (several volumes, one
    # hashed in blocks, files larger than a content chunk), and the result compared with the original site.
    name: Manual restore (documented steps)
    runs-on: ubuntu-latest
    needs: static
    defaults:
      run:
        working-directory: wp-checkpoint
    services:
      db:
        # The same server as the wp-env test site, so the collations in the backup are known to it.
        image: mariadb:lts
        env:
          MARIADB_ROOT_PASSWORD: password
        ports:
          - 33306:3306
    steps:
      - uses: actions/checkout@v4
        with:
          path: wp-checkpoint

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          tools: composer:v2

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: wp-checkpoint/package-lock.json

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache
          key: composer-${{ runner.os }}-8.3-${{ hashFiles('wp-checkpoint/composer.lock') }}
          restore-keys: composer-${{ runner.os }}-8.3-

      - run: composer install --no-interaction --no-progress --prefer-dist
      - run: npm ci
      - run: npx wp-env start

      - name: Build the archive and the original's fingerprint
        run: npx wp-env run tests-cli --env-cwd=wp-content/plugins/wp-checkpoint wp eval-file tests/acceptance/manual-restore/build.php

      - name: Wait for the target database
        run: |
          for i in $(seq 1 60); do
            php -r 'mysqli_report(MYSQLI_REPORT_OFF); exit(@mysqli_connect("127.0.0.1", "root", "password", "", 33306) ? 0 : 1);' && exit 0
            sleep 2
          done
          exit 1

      - name: Restore by hand and compare
        run: bash tests/acceptance/manual-restore/restore.sh build/manual-restore 127.0.0.1 33306 root password

      - name: Show wp-env logs on failure
        if: failure()
        run: npx wp-env logs tests --watch=false

  integration-multisite:
    name: Integration (wp-env, multisite)
    runs-on: ubuntu-latest
    needs: static
    defaults:
      run:
        working-directory: wp-checkpoint
    steps:
      - uses: actions/checkout@v4
        with:
          path: wp-checkpoint

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          tools: composer:v2

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: wp-checkpoint/package-lock.json

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache
          key: composer-${{ runner.os }}-8.3-${{ hashFiles('wp-checkpoint/composer.lock') }}
          restore-keys: composer-${{ runner.os }}-8.3-

      - run: composer install --no-interaction --no-progress --prefer-dist
      - run: npm ci
      - run: npx wp-env start
      - run: npm run test:integration:multisite

      - name: Show wp-env logs on failure
        if: failure()
        run: npx wp-env logs tests --watch=false

  database-servers:
    # A restore's handling of foreign keys rests on how each server behaves (constraint names, renames,
    # drops), and the uninstall fence on how it locks one row both sides write: measured on the real servers,
    # compared with the recorded expectations on every change.
    name: Database server (${{ matrix.image }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: ['mysql:5.7', 'mysql:8.0', 'mysql:8.4', 'mariadb:10.6', 'mariadb:10.11', 'mariadb:11.4', 'mariadb:11.8', 'mariadb:lts']
    services:
      db:
        image: ${{ matrix.image }}
        env:
          MYSQL_ROOT_PASSWORD: password
          MARIADB_ROOT_PASSWORD: password
        ports:
          - 33306:3306
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - name: Wait for the server
        run: |
          for i in $(seq 1 60); do
            php -r 'mysqli_report(MYSQLI_REPORT_OFF); exit(@mysqli_connect("127.0.0.1", "root", "password", "", 33306) ? 0 : 1);' && exit 0
            sleep 2
          done
          exit 1

      - run: php tests/Fixtures/Restore/foreign-keys.php 127.0.0.1 33306 root password --check
      - run: php tests/Fixtures/Restore/constraint-rules.php 127.0.0.1 33306 root password
      - run: php tests/Fixtures/Restore/meta-key-scan.php 127.0.0.1 33306 root password
      - run: php tests/Fixtures/Restore/rename-matrix.php 127.0.0.1 33306 root password
      - run: php tests/Fixtures/Jobs/fence-matrix.php 127.0.0.1 33306 root password

  plugin-check:
    name: Plugin Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The package, not the development checkout: only the paths the build lists, and the build fails when
      # the package holds anything else, a symbolic link, a vendor directory or a name beginning with a dot.
      - name: Build and check the package
        run: bash bin/build-dist.sh

      # The action resolves "latest" through the WordPress/WordPress GitHub mirror, which lags behind
      # wordpress.org on release days (missing tag); trunk always exists and Plugin Check only lints.
      - name: Run Plugin Check
        uses: WordPress/plugin-check-action@v1
        with:
          build-dir: build/wp-checkpoint
          wp-version: trunk
