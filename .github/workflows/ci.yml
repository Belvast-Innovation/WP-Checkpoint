name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  static:
    name: Lint & analyse (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['7.4', '8.1', '8.3', '8.4']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php: ${{ matrix.php }}
          coverage: none
          tools: composer:v2
      - run: composer install --no-interaction --no-progress
      - run: composer lint
      - run: composer analyse
      - run: composer test:unit

  integration:
    name: Integration (wp-env)
    runs-on: ubuntu-latest
    needs: static
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci || npm install
      - run: npx wp-env start
      # T001: install composer dev deps inside the tests container and run integration suite.
      - run: npm run test:integration
